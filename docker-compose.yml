# Airflow + dbt + Postgres reliability demo
# Start:  docker compose up airflow-init && docker compose up -d
# UI:     http://localhost:8080  (admin / admin)
# DWH:    localhost:5433  (db: warehouse, user: warehouse, pw: warehouse)

x-airflow-common: &airflow-common
  build: .
  image: airflow-dbt-demo:latest
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__WEBSERVER__SECRET_KEY: demo-secret-key-change-me
    # Warehouse connection, used by load_orders.py and dbt (profiles.yml)
    WAREHOUSE_HOST: warehouse
    WAREHOUSE_PORT: "5432"
    WAREHOUSE_DB: warehouse
    WAREHOUSE_USER: warehouse
    WAREHOUSE_PASSWORD: warehouse
    DBT_PROFILES_DIR: /opt/airflow/dbt
    DBT_BIN: /home/airflow/dbt_venv/bin/dbt
  volumes:
    - ./dags:/opt/airflow/dags
    - ./dbt:/opt/airflow/dbt
    - ./data:/opt/airflow/data
    - ./scripts:/opt/airflow/scripts
    - ./logs:/opt/airflow/logs
  depends_on:
    airflow-db:
      condition: service_healthy
    warehouse:
      condition: service_healthy

services:
  # Airflow metadata database: stores every task state (what to resume after a failure)
  airflow-db:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow", "-d", "airflow"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  # Data warehouse: raw / staging / marts schemas (created by warehouse/init.sql)
  warehouse:
    image: postgres:16
    environment:
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: warehouse
      POSTGRES_DB: warehouse
    ports:
      - "5433:5432"
    volumes:
      - warehouse-data:/var/lib/postgresql/data
      - ./warehouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "warehouse", "-d", "warehouse"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  # One-shot: migrate the Airflow DB and create the admin user
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create --username admin --password admin \
          --firstname Demo --lastname Admin --role Admin --email admin@example.com
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Optional: lineage graph. Start with:  docker compose --profile docs up dbt-docs
  # Then open http://localhost:8081
  dbt-docs:
    <<: *airflow-common
    profiles: ["docs"]
    working_dir: /opt/airflow/dbt
    entrypoint: /bin/bash
    command:
      - -c
      - |
        $${DBT_BIN} docs generate && $${DBT_BIN} docs serve --host 0.0.0.0 --port 8081
    ports:
      - "8081:8081"
    restart: "no"

volumes:
  airflow-db-data:
  warehouse-data:
