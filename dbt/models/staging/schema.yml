version: 2

models:
  - name: stg_customers
    columns:
      - name: customer_id
        data_tests: [unique, not_null]

  - name: stg_orders
    columns:
      - name: order_id
        data_tests: [unique, not_null]          # duplicates, null keys
      - name: customer_id
        data_tests:
          - relationships:                      # orphan customers
              to: ref('stg_customers')
              field: customer_id
      - name: status
        data_tests:
          - accepted_values:                    # warn only: alerts, does not block
              values: ['paid', 'shipped', 'cancelled', 'refunded']
              config:
                severity: warn
      - name: amount
        data_tests:
          - not_null
          - non_negative                        # negative amounts
